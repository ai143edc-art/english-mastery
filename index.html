<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>English Mastery — Personal Tutor</title>
<style>
  :root{
    --bg:#0f1120; --bg2:#161a34; --card:#1c2140; --card2:#232a52;
    --line:#2e376a; --txt:#eef1ff; --muted:#9aa3d4; --muted2:#6f78b0;
    --brand:#6c8bff; --brand2:#8a6bff; --teal:#37e0c8; --green:#3ddc84;
    --amber:#ffcb57; --red:#ff6b7a; --pink:#ff7bc1;
    --grad:linear-gradient(135deg,#6c8bff,#8a6bff 55%,#b06bff);
    --grad2:linear-gradient(135deg,#37e0c8,#6c8bff);
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%,#20264f 0%,transparent 55%),
               radial-gradient(1000px 600px at 110% 10%,#2a1f4d 0%,transparent 50%),
               var(--bg);
    color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  a{color:inherit}
  .wrap{max-width:920px;margin:0 auto;padding:16px 16px 20px}
  /* ---------- Top bar ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;
        font-weight:800;font-size:20px;box-shadow:0 8px 24px rgba(120,110,255,.45)}
  .brand h1{font-size:18px;margin:0;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .stats{display:flex;gap:8px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
        display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
  .pill small{color:var(--muted);font-weight:600;font-size:11px;display:block;margin-top:-2px}
  .pill .ic{font-size:16px}
  /* ---------- Cards ---------- */
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
        border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
  .section-title h2{font-size:15px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700}
  /* ---------- Hero / daily ---------- */
  .hero{position:relative;overflow:hidden}
  .hero .glow{position:absolute;inset:-40% -10% auto auto;width:60%;height:220%;
        background:radial-gradient(circle,rgba(138,107,255,.35),transparent 60%);pointer-events:none}
  .hero h2{font-size:20px}
  .lvlbar{height:10px;border-radius:20px;background:#2a3160;overflow:hidden;margin:12px 0 6px}
  .lvlbar > i{display:block;height:100%;background:var(--grad);border-radius:20px;transition:width .6s}
  .lvlmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  /* ---------- Daily quest list ---------- */
  .quests{display:grid;gap:10px;margin-top:14px}
  .quest{display:flex;align-items:center;gap:13px;background:var(--card2);border:1px solid var(--line);
        border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;text-align:left}
  .quest:hover{border-color:var(--brand);transform:translateY(-1px)}
  .quest .qi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .quest b{font-size:14.5px} .quest span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .quest .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted2);flex:0 0 auto}
  .quest.done .chk{background:var(--green);border-color:var(--green);position:relative}
  .quest.done .chk:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#06210f;font-weight:900;font-size:15px}
  .quest.done b{color:var(--muted);text-decoration:line-through}
  /* ---------- Nav ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(16,18,32,.86);backdrop-filter:blur(14px);
       border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 10px;z-index:50}
  .nav button{background:none;border:none;color:var(--muted2);display:flex;flex-direction:column;align-items:center;
       gap:3px;font-size:10.5px;font-weight:700;cursor:pointer;padding:5px 10px;border-radius:12px;flex:1;max-width:110px}
  .nav button .ic{font-size:21px;line-height:1}
  .nav button.active{color:var(--txt)}
  .nav button.active .ic{filter:drop-shadow(0 4px 10px rgba(120,120,255,.6))}
  .nav button.active{background:linear-gradient(180deg,rgba(108,139,255,.16),transparent)}
  /* ---------- Buttons ---------- */
  .btn{background:var(--grad);color:#fff;border:none;border-radius:13px;padding:13px 18px;font-weight:800;
       font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;
       box-shadow:0 8px 22px rgba(120,110,255,.35);transition:.15s}
  .btn:active{transform:scale(.97)}
  .btn.block{width:100%}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--txt)}
  .btn.teal{background:var(--grad2);color:#06231f;box-shadow:0 8px 22px rgba(55,224,200,.3)}
  .btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  /* ---------- Lesson / module list ---------- */
  .unit{margin-bottom:10px}
  .unit-head{display:flex;align-items:center;gap:12px;padding:6px 2px 10px}
  .unit-head .n{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:14px}
  .unit-head b{font-size:14px}.unit-head span{color:var(--muted);font-size:12px}
  .lessons{display:grid;gap:9px}
  .lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:12px 14px;cursor:pointer;transition:.15s}
  .lrow:hover{border-color:var(--brand)}
  .lrow .li{width:38px;height:38px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
  .lrow b{font-size:14px}.lrow span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .lrow .st{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted2)}
  .lrow.done .li{background:var(--green);color:#06210f}
  .lrow.done .st{color:var(--green)}
  /* ---------- Flashcard ---------- */
  .fc{perspective:1400px;margin:8px 0 16px}
  .fc-inner{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:grid;place-content:center;
           text-align:center;padding:24px;border:1px solid var(--line)}
  .fc-front{background:linear-gradient(160deg,#232a52,#171b36)}
  .fc-back{background:var(--grad);transform:rotateY(180deg);color:#fff}
  .fc-word{font-size:36px;font-weight:800;margin-bottom:6px}
  .fc-sub{color:var(--muted);font-size:14px}
  .fc-hi{font-size:34px;font-weight:800}
  .fc-ex{margin-top:14px;font-size:14px;opacity:.92;font-style:italic}
  .fc-tap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted2)}
  .fc-back .fc-tap{color:rgba(255,255,255,.7)}
  /* ---------- Speaking ---------- */
  .mic{width:96px;height:96px;border-radius:50%;background:var(--grad);border:none;display:grid;place-items:center;
       font-size:40px;cursor:pointer;margin:8px auto;box-shadow:0 10px 30px rgba(120,110,255,.5);transition:.2s}
  .mic.rec{background:var(--grad2);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,224,200,.5)}70%{box-shadow:0 0 0 22px rgba(55,224,200,0)}100%{box-shadow:0 0 0 0 rgba(55,224,200,0)}}
  .target{font-size:24px;font-weight:800;text-align:center;margin:6px 0}
  .heard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;min-height:48px;font-size:15px}
  .score{font-size:44px;font-weight:900;text-align:center}
  .wgood{color:var(--green)} .wbad{color:var(--red)}
  /* ---------- Writing ---------- */
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;color:var(--txt);
           padding:13px;font-size:15px;font-family:inherit;resize:vertical;min-height:120px}
  textarea:focus{outline:none;border-color:var(--brand)}
  /* ---------- misc ---------- */
  .speak-ic{cursor:pointer;color:var(--teal);font-size:18px;vertical-align:middle;user-select:none}
  .hi{color:var(--teal);font-weight:700}
  .tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:3px 11px;
       font-size:11.5px;color:var(--muted);font-weight:700;margin:0 6px 6px 0}
  .lesson-body{font-size:15.5px;line-height:1.75}
  .lesson-body p{margin:0 0 12px}
  .example{background:var(--card2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:11px 14px;margin:10px 0}
  .example .en{font-weight:700;font-size:16px}
  .example .hi{color:var(--muted);font-size:13.5px;margin-top:2px;display:block;-webkit-text-fill-color:var(--muted)}
  .reading-word{cursor:pointer;border-radius:4px;padding:0 1px;transition:.1s}
  .reading-word:hover,.reading-word.on{background:var(--brand);color:#fff}
  .pop{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--card);border:1px solid var(--brand);
       border-radius:12px;padding:9px 14px;font-size:14px;box-shadow:var(--shadow);z-index:60;display:none}
  .center{text-align:center}
  .back{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px;display:inline-flex;align-items:center;gap:6px}
  .quiz-opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;
            padding:13px 15px;margin-bottom:9px;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  .quiz-opt:hover{border-color:var(--brand)}
  .quiz-opt.correct{background:rgba(61,220,132,.16);border-color:var(--green)}
  .quiz-opt.wrong{background:rgba(255,107,122,.16);border-color:var(--red)}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--grad);
         color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}.brand p{display:none}.stats .pill small{display:none}}
  .miniprog{display:flex;gap:6px;margin-top:8px}
  .miniprog i{height:6px;flex:1;border-radius:6px;background:#2a3160}
  .miniprog i.on{background:var(--teal)}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">E</div>
      <div><h1>English Mastery</h1><p id="greet">Chalo aaj English seekhte hai 🚀</p></div>
    </div>
    <div class="stats">
      <div class="pill"><span class="ic">🔥</span><div><span id="streak">0</span><small>streak</small></div></div>
      <div class="pill"><span class="ic">⭐</span><div><span id="xp">0</span><small>XP</small></div></div>
    </div>
  </div>
  <div id="view"></div>
</div>

<nav class="nav">
  <button data-nav="home"><span class="ic">🏠</span>Home</button>
  <button data-nav="learn"><span class="ic">📚</span>Course</button>
  <button data-nav="words"><span class="ic">🃏</span>Words</button>
  <button data-nav="read"><span class="ic">📖</span>Read</button>
  <button data-nav="write"><span class="ic">✍️</span>Write</button>
  <button data-nav="speak"><span class="ic">🎤</span>Speak</button>
</nav>

<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ENGLISH MASTERY — personal self-learning app (single file)
   Data + logic below. Progress saved in localStorage.
   ============================================================ */

/* ---------- CONTENT: Course (Basic level) ---------- */

 {u:"Unit 1", t:"Pehle Kadam — Greetings & You", lessons:[

    body:[
     {p:"English mein milne par kya bolte hai — ye roz kaam aata hai. Har line ke saath 🔊 dabao aur repeat karo."},

   {id:"l2", icon:"🧍", t:"I, You, He, She (Pronouns)", tag:"Grammar",
    body:[
     {p:"Pronoun = naam ke jagah use hone wala shabd. Ye English ki neev hai."},
     {ex:["I — main","Main ek ladka hoon → I am a boy."]},
     {ex:["You — tum / aap","Tum acche ho → You are good."]},

     {ex:["It — ye/wo (cheez)","Ye bada hai → It is big."]},
     {ex:["We — hum","Hum dost hai → We are friends."]},
     {ex:["They — wo log","Wo log aaye → They came."]},
    ],
    quiz:[{q:"'Wo (ladki) gaati hai' — kaunsa pronoun?",o:["He","She","They"],a:1},

   {id:"l3", icon:"🔤", t:"am / is / are (To be)", tag:"Grammar",
    body:[
     {p:"'hoon / hai / ho' ke liye English mein am, is, are. Yaad rakhne ka rule:"},
     {ex:["I am","I am a technician. (Main technician hoon)"]},
     {ex:["He / She / It is","She is my sister. (Wo meri behen hai)"]},
     {ex:["You / We / They are","They are here. (Wo log yahan hai)"]},

 ]},

   {id:"l4", icon:"🔢", t:"Numbers 1–20", tag:"Vocab",
    body:[
     {p:"Ginti English mein — bol bol ke yaad karo (🔊)."},
     {ex:["one, two, three, four, five","1,2,3,4,5"]},
     {ex:["six, seven, eight, nine, ten","6,7,8,9,10"]},
     {ex:["eleven, twelve, thirteen, fourteen, fifteen","11–15"]},
     {ex:["sixteen, seventeen, eighteen, nineteen, twenty","16–20"]},
    ],
    quiz:[{q:"'Fifteen' kitna hota hai?",o:["5","50","15"],a:2}]},
   {id:"l5", icon:"📅", t:"Days & Time words", tag:"Vocab",
    body:[
     {ex:["Monday, Tuesday, Wednesday","Somvar, Mangalvar, Budhvar"]},
     {ex:["Thursday, Friday","Guruvar, Shukravar"]},
     {ex:["Saturday, Sunday","Shanivar, Ravivar"]},
     {ex:["today / yesterday / tomorrow","aaj / kal (beeta) / kal (aane wala)"]},
     {ex:["now / later / soon","abhi / baad mein / jaldi"]},
    ],
    quiz:[{q:"'Tomorrow' ka matlab?",o:["Aaj","Kal (aane wala)","Kal (beeta)"],a:1}]},
   {id:"l6", icon:"👨‍👩‍👧", t:"Family words", tag:"Vocab",
    body:[
     {ex:["mother / father","maa / pita"]},
     {ex:["brother / sister","bhai / behen"]},
     {ex:["son / daughter","beta / beti"]},
     {ex:["wife / husband","patni / pati"]},
     {ex:["friend","dost"]},
    ],
    quiz:[{q:"'Daughter' = ?",o:["Beta","Behen","Beti"],a:2}]},
 ]},
 {u:"Unit 3", t:"Chhote Vaakya banao — Sentences", lessons:[
   {id:"l7", icon:"🧩", t:"Sentence ka rule (SVO)", tag:"Grammar",
    body:[
     {p:"English vaakya = <b>Subject + Verb + Object</b>. (Kaun + Kaam + Kispe)"},
     {ex:["I eat rice.","Main chawal khata hoon. (I=kaun, eat=kaam, rice=kya)"]},
     {ex:["She reads a book.","Wo kitab padhti hai."]},
     {ex:["We play cricket.","Hum cricket khelte hai."]},
     {p:"Hindi mein verb last mein aata hai, English mein beech mein. Yahi sabse bada difference hai."},

   {id:"l8", icon:"❓", t:"Sawaal poochhna (Questions)", tag:"Grammar",
    body:[
     {ex:["What is your name?","Tumhara naam kya hai?"]},
     {ex:["Where do you live?","Tum kaha rehte ho?"]},

let VOICE=null;

  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>/en-GB/i.test(v.lang)&&/female|zira|hazel|google uk english female/i.test(v.name))
       ||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0];
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,300);}
function say(text,rate){
  if(!('speechSynthesis'in window))return toast("Is browser mein awaaz nahi chalti");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=rate||.9;if(VOICE)u.voice=VOICE;
  speechSynthesis.speak(u);
}

function checkWriting(keys){
  const val=(document.getElementById("wr").value||"").trim();
  const feed=document.getElementById("wfeed");
  if(val.length<4){feed.innerHTML=`<div class="example" style="border-color:var(--red)"><b>Kuchh to likho 🙂</b></div>`;return;}
  const words=val.split(/\s+/).length;
  const lower=" "+val.toLowerCase()+" ";
  const hit=keys.filter(k=>lower.includes(k));
  const cap=/^[A-Z]/.test(val), dot=/[.!?]\s*$/.test(val.trim());
  let tips=[];
  if(!cap)tips.push("Sentence ko <b>capital letter</b> se shuru karo.");
  if(!dot)tips.push("Vaakya ke ant mein <b>full stop (.)</b> lagao.");
  if(words<4)tips.push("Thoda aur likho — kam se kam ek pura vaakya.");
  const good=hit.length>=1&&words>=4&&cap&&dot;
  if(good)addXP(15),S.quests.write=1,save(),markQuestToast();
  feed.innerHTML=`
    <div class="example" style="border-color:${good?'var(--green)':'var(--amber)'};margin-top:14px">
      <b>${good?'🎉 Shaandaar! Bilkul sahi tarah likha.':'👍 Achhi koshish! Thoda sudhaar:'}</b>
      <div style="margin-top:8px;font-size:14px;color:var(--muted)">
        📝 ${words} words • ${hit.length} sahi keyword mile<br>
        ${tips.length?tips.map(t=>"• "+t).join("<br>"):"• Sab theek hai. Ab isko zor se bolo 🔊"}
      </div>
      <button class="btn teal sm" style="margin-top:10px" onclick="say(document.getElementById('wr').value)">🔊 Apna likha suno</button>
    </div>`;
}

/* ---------- speaking recognition ---------- */
let recog=null,recActive=false;
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();}
function startSpeak(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Ye browser mic nahi sunta — Chrome use karo");return;}
  const mic=document.getElementById("mic");
  if(recActive){recog&&recog.stop();return;}
  recog=new SR();recog.lang="en-US";recog.interimResults=false;recog.maxAlternatives=3;
  recActive=true;mic.classList.add("rec");mic.textContent="⏹";
  document.getElementById("micHint").textContent="Sun raha hoon... bolo!";
  recog.onresult=e=>{
    let best="";for(let i=0;i<e.results[0].length;i++){best=e.results[0][i].transcript;
      if(normalize(best)===normalize(SPEAK[S.speakIdx%SPEAK.length]))break;}
    scoreSpeak(best);
  };
  recog.onerror=()=>{document.getElementById("micHint").textContent="Sunai nahi diya, dobara try karo";};
  recog.onend=()=>{recActive=false;mic.classList.remove("rec");mic.textContent="🎤";};
  recog.start();
}
function scoreSpeak(heard){
  const target=SPEAK[S.speakIdx%SPEAK.length];
  const tw=normalize(target).split(" "),hw=normalize(heard).split(" ");
  let match=0;const used=[...hw];
  tw.forEach(w=>{const idx=used.indexOf(w);if(idx>-1){match++;used.splice(idx,1);}});
  const pct=Math.round(match/tw.length*100);
  const hd=document.getElementById("heard");hd.style.display="block";
  hd.innerHTML=`<span style="color:var(--muted);font-size:12px">Tumne bola:</span><br>"${heard}"`;
  const sc=document.getElementById("speakScore");
  const cls=pct>=80?"wgood":pct>=50?"":"wbad";
  sc.innerHTML=`<div class="score ${cls}">${pct}%</div>
    <p class="sub" style="margin-top:-4px">${pct>=80?'🎉 Perfect! Bahut badhiya bola.':pct>=50?'👍 Achha! Thoda aur saaf bolo.':'🔁 Dobara suno aur try karo.'}</p>`;
  if(pct>=80){addXP(10);S.quests.speak=1;save();markQuestToast();}
}
